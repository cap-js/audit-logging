name: "Integration tests"
description: "Run integration tests with BTP Audit Log Service bound"
inputs:
  CF_API:
    description: "Cloud Foundry API endpoint"
    required: true
  CF_USERNAME:
    description: "Cloud Foundry username"
    required: true
  CF_PASSWORD:
    description: "Cloud Foundry password"
    required: true
  CF_ORG:
    description: "Cloud Foundry organization"
    required: true
  CF_SPACE:
    description: "Cloud Foundry space"
    required: true
  NODE_VERSION:
    description: "Node.js version to use for tests"
    required: true
  CDS_VERSION:
    description: "CDS version to use for tests"
    required: true
  ALS_PLAN:
    description: "Audit Log Service plan: standard, premium, oauth2, ng"
    required: true
runs:
  using: "composite"
  steps:
    - name: Install Cloud Foundry CLI (v8.9.0)
      shell: bash
      run: |
        wget -q "https://packages.cloudfoundry.org/stable?release=linux64-binary&version=8.9.0&source=github-rel" -O cf-cli.tar.gz
        tar -xzf cf-cli.tar.gz
        sudo mv cf /usr/local/bin/
        sudo mv cf8 /usr/local/bin/
        cf --version

    - name: Authenticate with Cloud Foundry
      shell: bash
      env:
        CF_API: ${{ inputs.CF_API }}
        CF_USERNAME: ${{ inputs.CF_USERNAME }}
        CF_PASSWORD: ${{ inputs.CF_PASSWORD }}
        CF_ORG: ${{ inputs.CF_ORG }}
        CF_SPACE: ${{ inputs.CF_SPACE }}
      run: |
        for i in {1..5}; do
          cf api "$CF_API" && \
          cf auth && \
          cf target -o "$CF_ORG" -s "$CF_SPACE" && break
          echo "cf login failed, retrying ($i/5)..."
          sleep 10
          if [ "$i" -eq 5 ]; then
            echo "❌ cf login failed after 5 attempts."
            exit 1
          fi
        done

    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}

    - name: Use Node.js ${{ inputs.NODE_VERSION }}
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ inputs.NODE_VERSION }}

    - name: Install global CDS
      shell: bash
      run: npm i -g @sap/cds-dk@${{ inputs.CDS_VERSION }}

    - name: Install dependencies
      shell: bash
      run: npm i

    - name: Set CDS 8 compatible dependencies
      shell: bash
      run: |
        if [ "${{ inputs.CDS_VERSION }}" == "8" ]; then
          npm i -f @sap/cds@8 @cap-js/sqlite@1 @cap-js/cds-test@0 @sap/cds-mtxs@2
        fi

    - name: CDS versions
      shell: bash
      run: cds v

    - name: Bind Audit Log Service
      shell: bash
      run: |
        INSTANCE="cap-js-audit-logging-${{ inputs.ALS_PLAN }}"
        if [ "${{ inputs.ALS_PLAN }}" == "ng" ]; then
          cds bind audit-log --to "$INSTANCE" --kind audit-log-to-alsng
          cp .cdsrc-private.json test/integration/
        else
          cds bind audit-log -2 "$INSTANCE" --kind audit-log-to-restv2
        fi

    - name: Debug audit-log config (ng only)
      if: ${{ inputs.ALS_PLAN == 'ng' }}
      shell: bash
      run: |
        echo "=== .cdsrc-private.json ==="
        cat .cdsrc-private.json
        echo ""
        echo "=== test/integration/.cdsrc-private.json ==="
        cat test/integration/.cdsrc-private.json
        echo ""
        echo "=== Verify certificate and key ==="
        cds bind --exec -- node -e "
          const crypto = require('crypto');
          const https = require('https');
          const vcap = JSON.parse(process.env.VCAP_SERVICES);
          const creds = vcap['user-provided'][0].credentials;

          console.log('=== Credential fields ===');
          console.log('url:', creds.url);
          console.log('has cert:', !!creds.cert);
          console.log('cert length:', creds.cert?.length);
          console.log('has key:', !!creds.key);
          console.log('key length:', creds.key?.length);
          console.log('keyPassphrase:', creds.keyPassphrase);
          console.log('namespace:', creds.namespace);
          console.log('region:', creds.region);

          // Parse cert
          try {
            const certPem = creds.cert.split('-----END CERTIFICATE-----')[0] + '-----END CERTIFICATE-----';
            const x509 = new crypto.X509Certificate(certPem);
            console.log('');
            console.log('=== Certificate Details ===');
            console.log('subject:', x509.subject);
            console.log('issuer:', x509.issuer);
            console.log('validFrom:', x509.validFrom);
            console.log('validTo:', x509.validTo);
            console.log('serialNumber:', x509.serialNumber);
            const now = new Date();
            const validTo = new Date(x509.validTo);
            const validFrom = new Date(x509.validFrom);
            console.log('current time:', now.toISOString());
            console.log('is expired:', now > validTo);
            console.log('is not yet valid:', now < validFrom);
          } catch(e) {
            console.log('cert parse error:', e.message);
          }

          // Decrypt private key
          try {
            const keyObj = crypto.createPrivateKey({ key: creds.key, passphrase: creds.keyPassphrase });
            console.log('');
            console.log('=== Private Key ===');
            console.log('type:', keyObj.type);
            console.log('asymmetricKeyType:', keyObj.asymmetricKeyType);
            console.log('decryption with passphrase: SUCCESS');
          } catch(e) {
            console.log('');
            console.log('=== Private Key ===');
            console.log('decryption FAILED:', e.message);
          }

          // Direct HTTPS call to ALS NG (bypasses CDS entirely)
          console.log('');
          console.log('=== Direct HTTPS test call (bypassing CDS) ===');
          const url = new URL(creds.url + '/ingestion/v1/events');
          const testPayload = JSON.stringify([{id:crypto.randomUUID(),specversion:1,source:'/test/debug',type:'dppDataModification',time:new Date().toISOString(),data:{metadata:{ts:new Date().toISOString(),appId:'debug-test',infrastructure:{other:{runtimeType:'Node.js'}},platform:{other:{platformName:'CAP'}}},data:{dppDataModification:{objectType:'test',objectId:'test',attribute:'test',oldValue:'old',newValue:'new',dataSubjectType:'test',dataSubjectId:'test'}}}}]);
          console.log('target:', url.href);
          console.log('payload length:', testPayload.length);

          const req = https.request(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Content-Length': Buffer.byteLength(testPayload) },
            key: creds.key,
            cert: creds.cert,
            passphrase: creds.keyPassphrase
          }, (res) => {
            const chunks = [];
            res.on('data', c => chunks.push(c));
            res.on('end', () => {
              const body = Buffer.concat(chunks).toString();
              console.log('response status:', res.statusCode, res.statusMessage);
              console.log('response body:', body || '(empty)');
              if (res.statusCode === 401) {
                console.log('');
                console.log('CONCLUSION: Certificate is REJECTED by ALS NG service.');
                console.log('This is a credentials issue - the cert/key in the CF user-provided service are invalid or revoked.');
                console.log('Action needed: Update the cap-js-audit-logging-ng user-provided service with fresh credentials.');
              } else if (res.statusCode >= 200 && res.statusCode < 400) {
                console.log('');
                console.log('CONCLUSION: Certificate WORKS. The issue is in our CDS integration code.');
              } else {
                console.log('');
                console.log('CONCLUSION: Unexpected status', res.statusCode, '- needs investigation.');
              }
            });
          });
          req.on('error', (e) => {
            console.log('request error:', e.message);
            console.log('CONCLUSION: Network or TLS error - possibly cert/key format issue.');
          });
          req.write(testPayload);
          req.end();
        "

    - name: Run integration tests
      shell: bash
      run: |
        PLAN="${{ inputs.ALS_PLAN }}"
        if [ "$PLAN" == "standard" ]; then
          cds bind --exec -- npx jest --silent --testPathPatterns="test/integration/integration"
        elif [ "$PLAN" == "premium" ] || [ "$PLAN" == "oauth2" ]; then
          cds bind --exec -- npx jest --silent --testPathPatterns="test/integration/(integration|oauth2)"
        elif [ "$PLAN" == "ng" ]; then
          cds bind --exec -- npx jest --testPathPatterns="test/integration/(integration|ng)"
        fi
